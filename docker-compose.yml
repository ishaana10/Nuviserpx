version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuvis_erpx_app
    restart: always
    environment:
      DB_SERVER: db
      DB_USERNAME: erpx_user
      DB_PASSWORD: erpx_password
      DB_NAME: ajms_db
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: nuvis_erpx_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: nuvis_erpx_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ajms_db
      MYSQL_USER: erpx_user
      MYSQL_PASSWORD: erpx_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: nuvis_erpx_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
